    <rect x="570" y="150" width="180" height="180" rx="12"/>
    <rect x="780" y="150" width="180" height="180" rx="12"/>
    <rect x="150" y="360" width="180" height="180" rx="12"/>
    <rect x="360" y="360" width="180" height="180" rx="12"/>
    <rect x="570" y="360" width="180" height="180" rx="12"/>
    <rect x="780" y="360" width="180" height="180" rx="12"/>
