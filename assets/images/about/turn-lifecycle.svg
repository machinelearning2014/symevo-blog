<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" role="img" aria-label="Diagram: a request is classified by the Evidence Router, an ordered authority plan is derived and certified by Prolog, each authority runs its own evidence workflow, and a final-candidate verifier gates the answer into one of four terminal statuses."><style>
  svg{color:#102027}
  text{fill:currentColor;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  text.lbl{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){svg{color:#ecf5f5}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs><!-- request --><rect x="32" y="18" width="616" height="56" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55"/><text x="48" y="42" font-size="13" class="lbl" font-weight="600">request</text><text x="48" y="61" font-size="11" opacity="0.65">natural language &#8212; the only thing the model is trusted to interpret</text><line x1="340" y1="74" x2="340" y2="112" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" opacity="0.7"/><!-- evidence router --><rect x="32" y="120" width="616" height="92" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="48" y="143" font-size="13" class="lbl" font-weight="600">Evidence Router &#8212; &#8220;Lite-REASON&#8221;</text><text x="48" y="163" font-size="11" opacity="0.7">temperature-zero model, JSON-only fact extraction</text><text x="48" y="181" font-size="11" opacity="0.5">extracts action, target, criteria, operations, proof_mode, unresolved, alternatives</text><text x="48" y="199" font-size="11" opacity="0.5">supplies no phase plan &#8212; model-supplied phases are ignored</text><line x1="340" y1="212" x2="340" y2="250" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" opacity="0.7"/><!-- prolog --><rect x="32" y="258" width="616" height="86" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="48" y="281" font-size="13" class="lbl" font-weight="600">runtime-owned SWI-Prolog</text><text x="48" y="301" font-size="11" opacity="0.7">criterion_evidence/2 &#8594; required/1 &#8594; required_owner/1 &#8594; shortest valid sequence</text><text x="48" y="319" font-size="10" opacity="0.5">bounded to 7 phases &#183; enumerate before selecting, so cuts never hide a competing plan</text><text x="48" y="335" font-size="10" opacity="0.5">emits a routing status and a SHA-256 triage certificate</text><line x1="340" y1="344" x2="340" y2="382" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/><!-- authority phases --><rect x="32" y="390" width="196" height="104" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/><text x="46" y="412" font-size="12" font-weight="600" class="lbl">REASON</text><text x="46" y="432" font-size="10" opacity="0.65">Prolog derivation IS</text><text x="46" y="446" font-size="10" opacity="0.65">the evidence</text><text x="46" y="468" font-size="10" opacity="0.5">R1 SETUP &#8594; R6 ANSWER</text><text x="46" y="484" font-size="10" opacity="0.5">consistency + dependence</text><rect x="242" y="390" width="196" height="104" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/><text x="256" y="412" font-size="12" font-weight="600" class="lbl">MATHS</text><text x="256" y="432" font-size="10" opacity="0.65">computation, derivation,</text><text x="256" y="446" font-size="10" opacity="0.65">proof, or Lean formal</text><text x="256" y="468" font-size="10" opacity="0.5">M0 START &#8594; M5 ANSWER</text><text x="256" y="484" font-size="10" opacity="0.5">frozen certificate</text><rect x="452" y="390" width="196" height="104" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/><text x="466" y="412" font-size="12" font-weight="600" class="lbl">CODE</text><text x="466" y="432" font-size="10" opacity="0.65">source, diff, build and</text><text x="466" y="446" font-size="10" opacity="0.65">test output</text><text x="466" y="468" font-size="10" opacity="0.5">K1 INSPECT &#8594; K5 ANSWER</text><text x="466" y="484" font-size="10" opacity="0.5">post-mutation diff</text><line x1="340" y1="494" x2="340" y2="522" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/><!-- verifier --><rect x="112" y="530" width="456" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="132" y="550" font-size="12" class="lbl" font-weight="600">VerificationController &#8212; refusals are the point</text><line x1="340" y1="560" x2="340" y2="578" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/><text x="352" y="590" font-size="11" opacity="0.8">SOLVED &#183; MAPPED &#183; INCOMPLETE &#183; DISSOLVED</text></svg>
